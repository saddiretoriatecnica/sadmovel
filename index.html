/* ===== Cálculos de estoque e alertas ===== */
const stockOf=it=>R(it.lots.reduce((s,l)=>s+l.qty,0));
function earliestVal(it){
  let ls=it.lots.filter(l=>l.qty>0&&l.val);if(!ls.length)ls=it.lots.filter(l=>l.val&&it.lots.every(x=>x.qty<=0));
  const v=ls.map(l=>l.val).sort();return v[0]||null;}
const SAFE_DAYS=90;
const lotSafe=l=>!l.val||daysTo(l.val)>SAFE_DAYS;
const safeQty=it=>R(it.lots.filter(l=>l.qty>0&&lotSafe(l)).reduce((s,l)=>s+l.qty,0));
const expQty=it=>R(it.lots.filter(l=>l.qty>0&&!lotSafe(l)).reduce((s,l)=>s+l.qty,0));
function safeUntil(it){const v=it.lots.filter(l=>l.qty>0&&l.val&&lotSafe(l)).map(l=>l.val).sort();return v[0]||null;}
const safeCovers=it=>{const qs=safeQty(it);return qs>0&&(it.limit==null||qs>it.limit);};
function shownLots(it){const p=it.lots.filter(l=>l.qty>0);return p.length?p:it.lots.slice(0,1);}
function lotTag(it,l){
  const num=!lotUnnamed(l)&&it.kind==='med'?l.lote:'',old=it.lots.some(x=>x.qty>0&&!lotSafe(x));
  if(l.val&&daysTo(l.val)<0)return{k:'crit',t:'Lote vencido',num};
  if(!lotSafe(l))return{k:'crit',t:'Lote a vencer',num};
  return{k:'ok',t:old?'Novo lote':'Lote',num};}
function newLot(it){
  const t=todayISO(),ok=l=>l.qty>0&&l.entDate&&daysBetween(l.entDate,t)<=14&&lotSafe(l);
  const old=it.lots.some(l=>l.qty>0&&!lotSafe(l));
  return old?it.lots.filter(ok).sort((a,b)=>(b.val||'').localeCompare(a.val||''))[0]||null:null;}
function valSev(iso){
  if(!iso)return{k:'none',label:'Sem validade',d:null};
  const d=daysTo(iso);
  if(d<0)return{k:'crit',label:'Vencido há '+(-d)+' d',d};
  if(d===0)return{k:'crit',label:'Vence hoje',d};
  if(d<=30)return{k:'crit',label:d+' dias',d};
  if(d<=90)return{k:'orange',label:d+' dias',d};
  if(d<=180)return{k:'warn',label:d+' dias',d};
  return{k:'ok',label:d+' dias',d};}
function stockSev(it){
  const q=stockOf(it),qs=safeQty(it);
  if(it.off&&q<=0)return{k:'none',label:'Fora de uso'};
  if(q<0)return{k:'crit',label:'Negativo'};
  if(q===0)return{k:'crit',label:'Zerado'};
  if(it.limit==null)return{k:'none',label:'Sem limite'};
  if(qs<=it.limit)return{k:'crit',label:q>it.limit&&qs<q?'Só estoque vencendo':'Abaixo do limite'};
  if(qs<=Math.ceil(it.limit*1.5))return{k:'warn',label:'Perto do limite'};
  return{k:'ok',label:'Estoque ok'};}
function valSevItem(it){const v=valSev(earliestVal(it));
  if(v.k==='crit'&&safeCovers(it)&&expQty(it)>0)return{k:'orange',label:v.label+' · usar primeiro',d:v.d};return v;}
const itemRank=it=>Math.max(RANK[stockSev(it).k],RANK[valSevItem(it).k]);
const rowCls=it=>{const r=itemRank(it);return r>=3?'r-crit':r===2?'r-orange':r===1?'r-warn':'';};
const unitOf=it=>it.unit||'un.';
const R4=n=>Math.round(n*10000)/10000;
const o2Cyl=it=>(it.o2&&it.o2.cylL)||1000;
const O2_FLOWS=[1,2,3,4,5,8,10];
function o2Table(it){
  const q=Math.max(0,stockOf(it));
  return '<div class="tw"><table><thead><tr><th>Fluxo</th><th class="num">Tempo estimado de uso</th></tr></thead><tbody>'+O2_FLOWS.map(f=>'<tr><td>'+f+' L/min</td><td class="num">'+hrs(Math.floor(q/f))+'</td></tr>').join('')+'</tbody></table></div>';}
function o2Card(it){

  return '<section class="card" style="margin-top:14px"><h3 style="margin-top:0">Oxigênio disponível</h3><p class="muted sm" style="margin-top:0"><b>'+nf(q)+' L</b> no estoque, o equivalente a <b>'+nf(Math.max(0,R(q/cyl)))+' cilindro(s)</b> de 5 L cheios ('+nf(cyl)+' L de gás cada). Recarga média: '+(can('custos')?'<b>'+brl(it.price*cyl)+'</b> por cilindro.':'valor visível a quem tem acesso a custos.')+'</p>'+(q>0?o2Table(it):'<div class="err">Sem oxigênio registrado. Lance a recarga em Compras e entradas.</div>')+(can('itens')?'<div class="bar"><label style="flex-direction:row;align-items:center;gap:6px">Litros de gás por cilindro cheio de 5 L<input id="o2Cyl" type="number" min="1" value="'+cyl+'" style="width:100px"></label><button class="btn ghost sm" data-act="saveCyl" data-id="'+it.id+'">Salvar</button></div><p class="muted sm" style="margin:0">Padrão: 1.000 L (cilindro de 5 L a ~200 bar). Confira com o fornecedor; só vale para as próximas recargas.</p>':'')+'</section>';}

function availValid(it){return R(validLots(it).reduce((s,l)=>s+l.qty,0));}
function consume(it,qty){
  let left=R(qty);const out=[];
  for(const l of validLots(it)){if(left<=0)break;const t=Math.min(l.qty,left);l.qty=R(l.qty-t);left=R(left-t);out.push({lote:l.lote,val:l.val,nf:l.nf,qty:t,short:false});}

function manualCopy(t){openModal('<div class="mh"><h3>Copiar tabela</h3><button class="btn ghost sm" data-act="closeModal">Fechar</button></div><p class="muted">O navegador bloqueou a cópia automática. Selecione o texto abaixo e copie com Ctrl+C.</p><textarea id="mc" readonly rows="12">'+esc(t)+'</textarea>');const ta=$('#mc');ta.focus();ta.select();}
function copyText(t){
  const done=()=>toast('Tabela copiada. Cole no Excel ou Planilhas.');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>manualCopy(t));}else manualCopy(t);}

/* ===== Estoque ===== */
function estList(){
  const E=UI.est,q=E.q.trim().toLowerCase();
  let l=S.items.filter(i=>i.kind===E.kind);
  if(q)l=l.filter(i=>(i.name+' '+i.desc+' '+i.id).toLowerCase().includes(q));
  l=l.filter(i=>E.f==='off'?i.off:!i.off);
  if(E.f==='venc')l=l.filter(i=>i.lots.some(x=>x.qty>0&&x.val&&daysTo(x.val)<=90));
  if(E.f==='low')l=l.filter(i=>['crit','warn'].includes(stockSev(i).k));
  if(E.f==='ctrl')l=l.filter(i=>i.ctrl);
  if(E.f==='semval')l=l.filter(i=>!i.consume&&i.lots.some(x=>x.qty>0&&(!x.val||(i.kind==='med'&&(!x.lote||x.lote==='A confirmar')))));
  return E.sort==='id'?l.slice().sort((a,b)=>a.id.localeCompare(b.id,'pt',{numeric:true})):l.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt',{sensitivity:'base'}));}

/* ===== Checklists ===== */
const chkSt=k=>UI.chk[k]||(UI.chk[k]={});
const chkCount=k=>{const st=chkSt(k),L=CHK_LISTS[k];let c=0,n=0;L.forEach((g,gi)=>g.i.forEach((_,ii)=>{n++;if(st[gi+'-'+ii])c++;}));return{k:c,n};};
function chkHtml(k){
  const st=chkSt(k);
  return CHK_LISTS[k].map((g,gi)=>{const n=g.i.length,c=g.i.filter((_,ii)=>st[gi+'-'+ii]).length;
    return '<div class="cgrp"><div class="cgh"><label class="cgl"><input type="checkbox" data-cg="'+k+'" data-g="'+gi+'"'+(c===n?' checked':'')+'> <b>'+esc(g.t)+'</b></label><span class="muted sm" id="cc-'+k+gi+'">'+c+'/'+n+'</span></div>'+
      '<details><summary>Ver itens ('+n+')</summary><ul class="cit">'+g.i.map((x,ii)=>'<li><label><input type="checkbox" data-ci="'+k+'" data-g="'+gi+'" data-i="'+ii+'"'+(st[gi+'-'+ii]?' checked':'')+'> '+esc(x)+'</label></li>').join('')+'</ul></details></div>';}).join('');}
function chkRefresh(k){
  const st=chkSt(k);CHK_LISTS[k].forEach((g,gi)=>{const c=g.i.filter((_,ii)=>st[gi+'-'+ii]).length,b=$('[data-cg="'+k+'"][data-g="'+gi+'"]'),s=$('#cc-'+k+gi);
    if(b)b.checked=c===g.i.length;if(s)s.textContent=c+'/'+g.i.length;
    g.i.forEach((_,ii)=>{const x=$('[data-ci="'+k+'"][data-g="'+gi+'"][data-i="'+ii+'"]');if(x)x.checked=!!st[gi+'-'+ii];});});
  const t=$('#ct-'+k),c=chkCount(k);if(t)t.textContent=c.k+' de '+c.n+' itens marcados';}
function chkTick(t){
  const d=t.dataset,k=d.cg||d.ci,gi=+d.g,st=chkSt(k);
  if(d.cg)CHK_LISTS[k][gi].i.forEach((_,ii)=>{st[gi+'-'+ii]=t.checked;});else st[gi+'-'+d.i]=t.checked;
  chkRefresh(k);}

const TIPO={entrada:['ok','Entrada'],saida:['acc','Saída'],perda:['crit','Perda'],ajuste:['warn','Ajuste'],errata:['warn','Errata']};
function bookTable(it,from,to){
  const bd=bookData(it,from,to),tsv=[['Nº','Data','Movimento','Descrição','Lote','Validade','Nota fiscal','Quantidade','Saldo','Observações','Responsável / assinatura digital'].join('\t')];
  let body='';let n=0;
  if(bd.prev!=null)body+='<tr><td></td><td colspan="7" class="muted">Saldo anterior ao período</td><td class="num"><b>'+nf(bd.prev)+'</b></td><td colspan="2"></td></tr>';
  bd.rows.forEach(r=>{n++;const q=signedQty(r),sp=sigParts(r),ex=r.manual?'Linha lançada pelo RT':'',sig=sp.map(x=>x[0]+': '+x[1]).join(' · ')+(ex?' · '+ex:'')+' · '+fmtTs(r.ts);
    body+='<tr><td class="num muted">'+n+'</td><td>'+fmtD(r.date)+'</td><td>'+pill(TIPO[r.type][0],TIPO[r.type][1])+'</td><td>'+esc(r.desc||'')+'</td><td class="mono">'+esc(r.lote||'—')+'</td><td>'+fmtD(r.val)+'</td><td>'+esc(r.nf||'—')+'</td>'+
      '<td class="num '+(q<0?'t-crit':'t-ok')+'">'+(r.type==='errata'?'—':(q>0?'+':'−')+nf(Math.abs(q)))+'</td><td class="num"><b>'+nf(r.bal)+'</b></td><td>'+esc(r.obs||'')+'</td><td class="sig">'+sp.map(x=>'<span class="muted">'+esc(x[0])+':</span> '+esc(x[1])).join('<br>')+'<br><span class="muted">'+(ex?esc(ex)+' · ':'')+fmtTs(r.ts)+'</span></td></tr>';
    tsv.push([n,fmtD(r.date),TIPO[r.type][1],r.desc||'',r.lote||'',fmtD(r.val),r.nf||'',(r.type==='errata'?'':String(q).replace('.',',')),String(r.bal).replace('.',','),r.obs||'',sig].join('\t'));});

/* ===== Estatísticas ===== */
const MID={'<30 min':20,'30-60 min':45,'60-90 min':75,'90-120 min':105,'>120 min':135};
const pcn=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const hrs=m=>m?(m>=60?Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0')+' min':Math.round(m)+' min'):'—';
function stBase(){const f=UI.st;return S.patients.filter(p=>p.status!=='refeito'&&p.status!=='devolvido'&&visPat(p)&&(!f.from||p.date>=f.from)&&(!f.to||p.date<=f.to));}
function stGroup(list,keyFn){const g={};list.forEach(p=>{const k=keyFn(p);(g[k]=g[k]||[]).push(p);});return g;}
function stTable(head,rows,empty){return rows.length?'<div class="tw"><table><thead><tr>'+head.map((h,i)=>'<th'+(i?' class="num"':'')+'>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="num"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p class="muted">'+(empty||'Sem dados no período.')+'</p>';}
function stBars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return '<div class="bars">'+rows.map(r=>'<div class="brw"><span>'+esc(r[0])+'</span><div class="b"><i style="width:'+Math.max(2,r[1]/mx*100)+'%"></i></div><span class="num">'+r[2]+'</span></div>').join('')+'</div>';}
function stOut(){
  const cu=can('custos'),all=stBase(),ef=all.filter(p=>p.status==='efetivado'),pac=ef.filter(p=>p.motivo==='Atendimento ao paciente');

  /* checklists */
  const cs=all.filter(p=>p.chk),sf=cs.filter(p=>p.chk.saida.mode!=='pulado'),lo=cs.filter(p=>p.chk.local.k>0),lc=cs.filter(p=>p.chk.local.k>0&&p.chk.local.k===p.chk.local.n),sem=all.length-cs.length;
  const kpi='<div class="stats" style="margin:0 0 12px"><div class="stat"><div class="v">'+all.length+'</div><div class="l">Fichas no período (pendentes e efetivadas)</div></div>'+
   '<div class="stat '+(cs.length&&sf.length/cs.length>=.8?'ok':'warn')+'"><div class="v">'+pcn(sf.length,cs.length)+'</div><div class="l">Com checklist de saída da SAD ('+sf.length+' de '+cs.length+')</div></div>'+
   '<div class="stat '+(cs.length&&lo.length/cs.length>=.8?'ok':'warn')+'"><div class="v">'+pcn(lo.length,cs.length)+'</div><div class="l">Com checklist no local ('+lo.length+' de '+cs.length+'; completos: '+lc.length+')</div></div>'+
   (sem?'<div class="stat"><div class="v">'+sem+'</div><div class="l">Fichas sem registro de checklist (anteriores ao recurso)</div></div>':'')+'</div>';
  const byU=stGroup(all,p=>p.user+'|'+ROLES[p.role]);
  const uRows=Object.keys(byU).sort().map(k=>{const l=byU[k],c=l.filter(p=>p.chk),dev=S.patients.filter(p=>p.user===l[0].user&&p.status==='devolvido'&&(!UI.st.from||p.date>=UI.st.from)&&(!UI.st.to||p.date<=UI.st.to)).length,
    sfn=c.filter(p=>p.chk.saida.mode!=='pulado').length,lon=c.filter(p=>p.chk.local.k>0).length,pl=avg(c.filter(p=>p.chk.local.n).map(p=>p.chk.local.k/p.chk.local.n*100));
    return [esc(l[0].user)+' <span class="muted sm">'+k.split('|')[1]+'</span>',l.length,pcn(sfn,c.length),pcn(lon,c.length),c.length?Math.round(pl)+'%':'—',dev];});

  /* especialidade x tempo */
  const byE=stGroup(pac,p=>espOf(p)||'Não informada');
  const eRows=Object.keys(byE).sort((a,b)=>byE[b].length-byE[a].length).map(k=>{const l=byE[k],t=l.filter(p=>MID[p.tp]);
    return [esc(k),l.length].concat(FAIXAS.map(f=>l.filter(p=>p.tp===f).length||'·')).concat([t.length?hrs(avg(t.map(p=>MID[p.tp]))):'—']);});
  const espT=sec('Tempo de procedimento por especialidade','Quantidade de pacientes por faixa de tempo cirúrgico. O tempo médio é uma estimativa feita com o ponto médio de cada faixa (a faixa ">120 min" conta como 135 min).',stTable(['Especialidade','Pacientes'].concat(FAIXAS).concat(['Tempo médio estimado']),eRows));
  /* médicos */
  const byM=stGroup(pac,p=>p.medico||'—');
  const mRows=Object.keys(byM).sort((a,b)=>byM[b].length-byM[a].length).map(k=>{const l=byM[k],t=l.filter(p=>MID[p.tp]),esp=stGroup(l,p=>espOf(p)||'—'),top=Object.keys(esp).sort((a,b)=>esp[b].length-esp[a].length).slice(0,2).map(x=>x+' ('+esp[x].length+')').join(', ');
    return [esc(k),l.length,t.length?hrs(avg(t.map(p=>MID[p.tp]))):'—',esc(top)].concat(cu?[brl(avg(l.map(p=>p.cost)))]:[]);});
  const med=sec('Atendimentos por anestesista','Somente atendimentos a pacientes com ficha efetivada, por médico responsável.',stTable(['Médico responsável','Pacientes','Tempo médio estimado','Especialidades mais frequentes'].concat(cu?['Custo médio por paciente']:[]),mRows));
  let custo='';
  if(cu){
    const ce=Object.keys(byE).sort((a,b)=>byE[b].length-byE[a].length).map(k=>{const l=byE[k],c=l.map(p=>p.cost);return [esc(k),l.length,brl(avg(c)),brl(Math.max(...c)),brl(c.reduce((s,x)=>s+x,0))];});
    const byT=stGroup(pac.filter(p=>MID[p.tp]),p=>p.tp),tr=FAIXAS.filter(f=>byT[f]).map(f=>{const l=byT[f],m=avg(l.map(p=>p.cost));return [f,l.length,brl(m),brl(m/(MID[f]/60))];});
    custo=sec('Custo por paciente, por especialidade','Média, maior valor e total gasto em medicamentos e insumos.',stTable(['Especialidade','Pacientes','Custo médio','Maior custo','Total'],ce))+
     sec('Gasto do paciente por tempo de procedimento','O custo por hora é uma estimativa: custo médio da faixa dividido pelo ponto médio do tempo.',stBars(tr.map(r=>[r[0],avg(byT[r[0]].map(p=>p.cost)),r[2]]))+'<div style="margin-top:12px"></div>'+stTable(['Faixa de tempo','Pacientes','Custo médio','Custo por hora (estimado)'],tr));
  }
  /* turno, faixa etária */
  const turno=stGroup(pac,p=>p.turno||'Não informado'),tRows=Object.keys(turno).map(k=>[k,turno[k].length].concat(cu?[brl(avg(turno[k].map(p=>p.cost)))]:[]));
  const fe=a=>a===''||a==null?'Não informada':a<=2?'0 a 2 anos':a<=12?'3 a 12 anos':a<=17?'13 a 17 anos':a<=59?'18 a 59 anos':'60 anos ou mais',byA=stGroup(pac,p=>fe(p.idade===''?'':+p.idade));
  const aRows=['0 a 2 anos','3 a 12 anos','13 a 17 anos','18 a 59 anos','60 anos ou mais','Não informada'].filter(k=>byA[k]).map(k=>[k,byA[k].length,hrs(avg(byA[k].filter(p=>MID[p.tp]).map(p=>MID[p.tp])))].concat(cu?[brl(avg(byA[k].map(p=>p.cost)))]:[]));
  const perfil='<div class="cols">'+sec('Por turno','',stTable(['Turno','Pacientes'].concat(cu?['Custo médio']:[]),tRows))+sec('Por faixa etária','',stTable(['Faixa','Pacientes','Tempo médio'].concat(cu?['Custo médio']:[]),aRows))+'</div>';
  /* itens */
  const it={};ef.forEach(p=>p.lines.forEach(l=>{const o=it[l.id]||(it[l.id]={n:l.name,unit:l.unit,q:0,v:0,pac:0});o.q=R(o.q+l.qty);o.v=R(o.v+(l.qty+(l.dsc||0))*l.price);o.pac++;}));
  const top=Object.values(it).sort((a,b)=>(cu?b.v-a.v:b.pac-a.pac)).slice(0,10);
  const itens=sec('Itens mais usados','Os 10 primeiros '+(cu?'por valor gasto.':'por número de fichas.')+' Multidose já aberta não conta como gasto.',stTable(['Item','Fichas','Quantidade baixada'].concat(cu?['Valor']:[]),top.map(o=>[esc(o.n),o.pac,nf(o.q)+' '+esc(o.unit)].concat(cu?[brl(o.v)]:[]))));
  /* oxigênio */
  const o2i=S.items.find(i=>i.o2);let oxi='';
  if(o2i){const ol=pac.map(p=>({p,l:p.lines.find(l=>l.id===o2i.id)})).filter(x=>x.l&&x.l.qty>0),tL=ol.reduce((s,x)=>s+x.l.qty,0),tM=ol.reduce((s,x)=>s+(x.l.used||0),0),f=S.movs.filter(m=>m.itemId===o2i.id&&m.type==='entrada'&&/^Recarga/.test(m.desc||'')&&(!UI.st.from||m.date>=UI.st.from)&&(!UI.st.to||m.date<=UI.st.to)),cyl=R(f.reduce((s,m)=>s+m.qty,0)/o2Cyl(o2i));
    const oe=stGroup(ol,x=>espOf(x.p)||'Não informada'),oRows=Object.keys(oe).sort((a,b)=>oe[b].length-oe[a].length).map(k=>{const l=oe[k];return [esc(k),l.length,nf(Math.round(avg(l.map(x=>x.l.used||0)))),nf(R(tL&&l.length?l.reduce((s,x)=>s+x.l.qty,0)/l.reduce((s,x)=>s+(x.l.used||1),0):0)),nf(Math.round(avg(l.map(x=>x.l.qty))))].concat(cu?[brl(avg(l.map(x=>x.l.qty*x.l.price)))]:[]);});
    oxi=sec('Oxigênio','Consumo em litros (tempo × fluxo) nos atendimentos a pacientes e recargas registradas no período.',
     '<div class="stats" style="margin:0 0 12px"><div class="stat"><div class="v">'+nf(tL)+' L</div><div class="l">Consumidos em '+ol.length+' atendimento(s)</div></div><div class="stat"><div class="v">'+(ol.length?nf(Math.round(tL/ol.length)):'—')+' L</div><div class="l">Média por paciente</div></div><div class="stat"><div class="v">'+(tM?nf(R(tL/tM)):'—')+'</div><div class="l">Fluxo médio (L/min)</div></div><div class="stat"><div class="v">'+nf(cyl)+'</div><div class="l">Cilindros recarregados</div></div></div>'+
     stTable(['Especialidade','Pacientes','Tempo médio (min)','Fluxo médio (L/min)','Litros por paciente'].concat(cu?['Custo de O₂ por paciente']:[]),oRows));}
  /* fluxo de fichas */
  const fl=S.patients.filter(p=>p.status!=='refeito'&&visPat(p)),dv=S.patients.filter(p=>p.refazDe&&visPat(p)).length;
  const fluxo=sec('Qualidade do preenchimento','Fichas devolvidas para correção indicam dados incompletos ou incorretos no lançamento.',
    stTable(['Situação','Fichas'],[['Efetivadas',fl.filter(p=>p.status==='efetivado').length],['Aguardando conferência',fl.filter(p=>p.status==='pendente').length],['Devolvidas e ainda não refeitas',fl.filter(p=>p.status==='devolvido').length],['Refeitas após devolução',dv]]));
  return (all.length?'':'<p class="muted">Nenhuma ficha no período.</p>')+checklists+espT+med+custo+perfil+itens+oxi+fluxo;}
function vEstat(){

  return '<h2>Estatísticas</h2><p class="sub">'+(can('todosAtend')?'Considera todas as fichas.':'Considera só as fichas que você preencheu ou das quais é o médico responsável.')+' Fichas devolvidas e refeitas ficam fora, exceto na tabela de qualidade. Custos aparecem só para quem tem acesso a valores.</p>'+

/* ===== PDF dos livros ===== */
const pdfTx=s=>String(s==null?'':s).replace(/[—–−]/g,'-').replace(/×/g,'x').replace(/✓/g,'').replace(/[^\n\x20-\x7E\u00A0-\u00FF]/g,'?');
async function buildBooksPdf(items,from,to,cover){
  const {PDFDocument,StandardFonts,rgb}=PDFLib,doc=await PDFDocument.create(),f=await doc.embedFont(StandardFonts.Helvetica),fb=await doc.embedFont(StandardFonts.HelveticaBold);
  const W=841.89,H=595.28,M=28,FS=7.5,LH=9.2,ink=rgb(.1,.1,.1),gray=rgb(.45,.45,.45),line=rgb(.75,.75,.75),band=rgb(.93,.95,.95);
  const per=(from||to)?('Período: '+(from?fmtD(from):'início')+' a '+(to?fmtD(to):'hoje')):'Período: todas as movimentações';
  const wrap=(t,font,size,w)=>{t=pdfTx(t);const out=[];t.split('\n').forEach(par=>{let cur='';par.split(/\s+/).forEach(word=>{
      while(font.widthOfTextAtSize(word,size)>w){let k=word.length;while(k>1&&font.widthOfTextAtSize(word.slice(0,k),size)>w)k--;if(cur){out.push(cur);cur='';}out.push(word.slice(0,k));word=word.slice(k);}
      const test=cur?cur+' '+word:word;if(font.widthOfTextAtSize(test,size)<=w)cur=test;else{if(cur)out.push(cur);cur=word;}});out.push(cur);});return out;};
  const txt=(pg,t,x,y,size,font,color)=>pg.drawText(pdfTx(t),{x,y,size,font:font||f,color:color||ink});
  const COLS=[['N',20],['Data',46],['Movimento',50],['Descrição',138],['Lote',52],['Validade',44],['NF',48],['Qtde',36],['Saldo',38],['Observações',120],['Preencheu / médico / RT (assinatura digital)',195.9]];
  const xs=[];let acc=M;COLS.forEach(c=>{xs.push(acc);acc+=c[1];});
  const pages=[];
  const newPage=()=>{const pg=doc.addPage([W,H]);pages.push(pg);return pg;};
  const gen='Gerado em '+fmtTs(new Date().toISOString())+' por '+curUser().name+' ('+ROLES[curUser().role]+')';
  if(cover){
    const pg=newPage();let y=H-M-6;
    txt(pg,'SAD Anestesia Móvel',M,y,9,fb,gray);y-=24;txt(pg,cover,M,y,20,fb);y-=20;txt(pg,per,M,y,10,f,gray);y-=26;
    const ch=[['Medicamento',260],['Lista',60],['Unidade',60],['Movimentações',90],['Saldo no livro',90],['Conferência com o estoque',200]];let cx=M;
    pg.drawRectangle({x:M,y:y-4,width:760,height:16,color:band});ch.forEach(c=>{txt(pg,c[0],cx+3,y,FS+.5,fb);cx+=c[1];});y-=18;
    items.forEach(it=>{const bd=bookData(it,from,to),ok=bookOk(it);cx=M;
      [it.name+(it.desc?' '+it.desc:''),it.ctrl.list||'-',unitOf(it),String(bd.rows.length),nf(bd.final),ok?'Confere com o estoque':'DIVERGÊNCIA: estoque '+nf(stockOf(it))].forEach((v,i)=>{txt(pg,v,cx+3,y,FS+.5,i===5&&!ok?fb:f);cx+=ch[i][1];});
      pg.drawLine({start:{x:M,y:y-4},end:{x:M+760,y:y-4},thickness:.4,color:line});y-=15;});
    y-=18;txt(pg,'Cada folha seguinte traz o livro de um medicamento. A coluna de responsável registra o login, o perfil e o horário de cada lançamento.',M,y,8,f,gray);}
  for(const it of items){
    const bd=bookData(it,from,to),ok=bookOk(it),npd=bookPendMovs(it).length,bk=S.books.find(b=>b.n===it.ctrl.book);
    let pg,y;
    const colHead=()=>{pg.drawRectangle({x:M,y:y-4,width:W-2*M,height:15,color:band});COLS.forEach((c,i)=>txt(pg,c[0],xs[i]+2,y,FS,fb));y-=16;};
    const head=(cont)=>{pg=newPage();y=H-M-4;
      txt(pg,'SAD Anestesia Móvel · '+bk.name+(it.ctrl.list?' · Lista '+it.ctrl.list:''),M,y,8.5,fb,gray);y-=20;
      txt(pg,it.name+(it.desc?' '+it.desc:'')+(cont?' (continuação)':''),M,y,15,fb);y-=15;
      txt(pg,per+'  |  Unidade: '+unitOf(it)+'  |  Saldo atual: '+nf(stockOf(it))+'  |  '+(ok?'Livro confere com o estoque'+(npd?' ('+npd+' linha(s) aguardando validação do RT, fora deste livro)':''):'DIVERGÊNCIA entre livro ('+nf(bd.final)+') e estoque'),M,y,8.5,f,gray);y-=18;colHead();};
    head(false);
    const rows=[];
    if(bd.prev!=null)rows.push(['','','','Saldo anterior ao período','','','','',nf(bd.prev),'','']);
    bd.rows.forEach((r,i)=>{const q=signedQty(r);
      rows.push([String(i+1),fmtD(r.date),TIPO[r.type][1],r.desc||'',r.lote||'-',fmtD(r.val),r.nf||'-',r.type==='errata'?'-':(q>0?'+':'-')+nf(Math.abs(q)),nf(r.bal),r.obs||'',sigParts(r).map(x=>x[0]+': '+x[1]).join('\n')+'\n'+(r.manual?'Linha lançada pelo RT · ':'')+fmtTs(r.ts)]);});
    if(!rows.length)rows.push(['','','','Nenhuma movimentação no período.','','','','','','','']);
    rows.forEach(r=>{const cells=r.map((v,i)=>wrap(v,f,FS,COLS[i][1]-5)),h=Math.max(...cells.map(c=>c.length))*LH+5;
      if(y-h<M+46){head(true);}
      cells.forEach((c,i)=>c.forEach((l,k)=>txt(pg,l,xs[i]+2,y-k*LH,FS,(i===8||i===2)?fb:f)));
      pg.drawLine({start:{x:M,y:y-h+LH-2},end:{x:W-M,y:y-h+LH-2},thickness:.3,color:line});y-=h;});

function atTotals(){

    const mn=$('#mn-'+id);if(mn)mn.textContent=used>0?(aberta&&nova?'Baixa no estoque: '+eff+' (1 já estava aberta)':aberta?'Multidose: sem baixa no estoque e sem custo':'Baixa no estoque: '+eff):'';
    if(used>0){n++;c+=eff*it.price;}});

const b64=a=>btoa(String.fromCharCode.apply(null,Array.from(new Uint8Array(a))));
async function pwHash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256));}

function genPass(){const L='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz',D='23456789',a=L+D,r=crypto.getRandomValues(new Uint8Array(12)),c=Array.from(r.slice(0,10)).map(x=>a[x%a.length]);c[r[10]%10]=D[r[11]%D.length];const k=(r[10]+5)%10;c[k]=L[r[11]%L.length];return c.join('');}

function getDl(){
  if(typeof claude!=='undefined'&&claude.use)return claude.use('downloads');
  return Promise.resolve({save:async({filename,data})=>{
    const type=/\.pdf$/i.test(filename)?'application/pdf':/\.json$/i.test(filename)?'application/json':'text/csv;charset=utf-8';
    const b=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2500);}});}

/* ----- Mensagens de erro em português ----- */
function ptErr(m){
  m=String(m||'');
  const map=[[/Invalid login credentials/i,'E-mail ou senha incorretos.'],[/Email not confirmed/i,'Este e-mail ainda não foi confirmado. Abra a mensagem que enviamos e clique no link.'],
   [/User already registered/i,'Este e-mail já tem cadastro. Use "Esqueci a senha" se precisar.'],[/rate limit|too many|only request this after|after \d+ seconds/i,'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.'],
   [/Password should be at least/i,'A senha é muito curta.'],[/same_password|different from the old/i,'A nova senha precisa ser diferente da atual.'],[/weak|pwned|easy to guess/i,'Senha considerada fraca. Escolha outra.'],
   [/Failed to fetch|NetworkError|Load failed/i,'Sem conexão com o servidor. Verifique a internet.'],[/Unable to validate email|invalid format/i,'E-mail inválido.'],
   [/Database error saving new user/i,'Este e-mail não foi liberado pelo RT.']];
  for(const [re,t] of map)if(re.test(m))return t;
  const k=m.match(/^(FORBIDDEN|LIVRO):\s*([\s\S]*)$/);if(k)return k[2];
  return m||'Erro inesperado.';}

async function gt(path,body,opt){
  opt=opt||{};let r;
  try{r=await fetch(SB.url+'/auth/v1'+path,{method:opt.method||'POST',headers:{apikey:SB.key,'Content-Type':'application/json',Authorization:'Bearer '+(opt.tok||SB.key)},body:body?JSON.stringify(body):undefined});}
  catch(e){const er=new Error('Failed to fetch');er.net=true;throw er;}
  const j=await jerr(r);
  if(!r.ok){const er=new Error((j&&(j.msg||j.message||j.error_description||j.error_code||j.error))||('Erro '+r.status));er.status=r.status;er.body=j;throw er;}
  return j;}
function setSess(j){
  SRV.tok=j.access_token;SRV.ref=j.refresh_token||SRV.ref;SRV.exp=Date.now()+(j.expires_in||3600)*1000;
  try{SRV.uid=JSON.parse(atob(SRV.tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;}catch(e){}
  try{localStorage.setItem(SESSK,JSON.stringify({ref:SRV.ref,tok:SRV.tok,exp:SRV.exp}));}catch(e){}}
function sessLoad(){try{const o=JSON.parse(localStorage.getItem(SESSK)||'null');if(o&&o.ref){SRV.tok=o.tok;SRV.ref=o.ref;SRV.exp=o.exp||0;try{SRV.uid=JSON.parse(atob(o.tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;}catch(e){}return true;}}catch(e){}return false;}
function srvClearSess(){SRV.tok=null;SRV.ref=null;SRV.uid=null;try{localStorage.removeItem(SESSK);}catch(e){}}
async function srvFresh(force){
  if(!SRV.tok)return;if(!force&&Date.now()<SRV.exp-60000)return;
  if(SRV.refreshing)return SRV.refreshing;
  SRV.refreshing=(async()=>{try{const j=await gt('/token?grant_type=refresh_token',{refresh_token:SRV.ref});setSess(j);}
    catch(e){if(e.status===400||e.status===401||e.status===403){srvLogoutLocal('Sua sessão expirou. Entre de novo.');}throw e;}
    finally{SRV.refreshing=null;}})();
  return SRV.refreshing;}
async function rest(path,opt){
  opt=opt||{};await srvFresh();let r;
  try{r=await fetch(SB.url+'/rest/v1'+path,{method:opt.method||'GET',headers:Object.assign({apikey:SB.key,'Content-Type':'application/json',Authorization:'Bearer '+(SRV.tok||SB.key)},opt.headers||{}),body:opt.body!==undefined?JSON.stringify(opt.body):undefined});}
  catch(e){const er=new Error('Failed to fetch');er.net=true;throw er;}
  const j=await jerr(r);
  if(!r.ok){const er=new Error((j&&(j.message||j.hint))||('Erro '+r.status));er.status=r.status;er.body=j;throw er;}
  return j;}
const rpc=(fn,args)=>rest('/rpc/'+fn,{method:'POST',body:args||{}});

/* ----- Estado inicial vazio e numeração ----- */
function srvSkeleton(){
  const s={v:12,userId:null,users:[],perms:defaultPerms(),books:[{n:1,name:'Livro 1 — Entorpecentes (lista A)'},{n:2,name:'Livro 2 — Psicotrópicos (lista B)'},{n:3,name:'Livro 3 — Controle especial (lista C)'}],items:[],movs:[],patients:[],pend:[],audit:[]};
  Object.defineProperty(s,'seq',{enumerable:false,configurable:true,
    get(){const d=SRV.ids;
      if(d.cur>=d.end){const b=d.blocks.shift();if(b){d.cur=b[0]-1;d.end=b[1];}else{d.cur=2e9+Math.floor(Math.random()*5e8);d.end=d.cur+1e5;}}
      if(d.end-d.cur<80&&!d.blocks.length)srvReserve();
      return d.cur;},
    set(v){SRV.ids.cur=v;}});
  return s;}
async function srvReserve(){
  const d=SRV.ids;if(d.busy)return;d.busy=true;
  try{const s=Number(await rpc('reserve_ids',{n:300}));d.blocks.push([s,s+299]);}catch(e){}finally{d.busy=false;}}

/* ----- Carga e aplicação dos documentos ----- */
function mergePerms(p){const d=defaultPerms();for(const r in d){p[r]=p[r]||{};for(const k in d[r])if(!(k in p[r]))p[r][k]=d[r][k];}return p;}
function srvApplyDocs(rows){
  for(const r of rows){
    const key=r.coll+'/'+r.id;
    if(r.coll==='meta'&&r.id==='perms')mergePerms(r.data);
    SRV.shadow.set(key,{rev:r.rev,js:JSON.stringify(r.data),del:r.deleted});
    if(ARRS.includes(r.coll)){
      const arr=S[r.coll],ix=SRV.idx[r.coll];let old=ix.get(r.id);
      if(!old&&!SRV.bulk){old=arr.find(x=>String(x.id)===r.id);}
      if(r.deleted){if(old){const i=arr.indexOf(old);if(i>=0)arr.splice(i,1);ix.delete(r.id);}}
      else if(old){arr[arr.indexOf(old)]=r.data;ix.set(r.id,r.data);}
      else{arr.push(r.data);ix.set(r.id,r.data);}
    }else if(r.coll==='meta'){
      if(r.id==='perms')S.perms=r.data;
      else if(r.id==='books')S.books=r.data;
      else if(r.id==='bookLock')S.bookLock=r.data;
      else if(r.id==='lastBackup')SRV.lastBackup=r.data;}
    if(r.ver>SRV.ver)SRV.ver=r.ver;}}
async function srvFetchDocs(from){
  let rows=[],cur=from;
  for(;;){const pg=await rest('/docs?select=coll,id,data,rev,ver,deleted&ver=gt.'+cur+'&order=ver.asc&limit=1000');rows=rows.concat(pg);if(pg.length<1000)break;cur=pg[pg.length-1].ver;}
  return rows;}
const mapProf=p=>({id:p.id,name:p.name,role:p.role,crm:p.crm||'',email:p.email,active:p.active,pending:!p.auth_id,authId:p.auth_id});
function applyProfiles(prof){const u=prof.map(mapProf);const ch=JSON.stringify(u)!==JSON.stringify(S.users);S.users=u;return ch;}
async function srvLoadAudit(){
  try{const a=await rest('/audit_log?select=ts,user_name,role,action&order=id.desc&limit=300');S.audit=a.map(x=>({ts:x.ts,user:x.user_name,role:x.role,action:x.action}));}catch(e){S.audit=[];}}
async function srvLoadAll(){
  ARRS.forEach(c=>{S[c].length=0;SRV.idx[c].clear();});SRV.shadow.clear();SRV.ver=0;SRV.lastBackup=null;S.bookLock=undefined;
  const prof=await rest('/profiles?select=*&order=name');
  applyProfiles(prof);
  const me=prof.find(p=>p.auth_id===SRV.uid);
  if(!me||!me.active)return null;
  S.userId=me.id;
  SRV.bulk=true;try{srvApplyDocs(await srvFetchDocs(0));}finally{SRV.bulk=false;}
  await srvLoadAudit();
  await srvReserve();
  return me;}

/* ----- Gravação: envia só o que mudou ----- */
function srvDiff(){
  const ch=[],seen=new Set();
  for(const c of ARRS)for(const o of S[c]){
    const id=String(o.id),key=c+'/'+id;seen.add(key);const js=JSON.stringify(o),sh=SRV.shadow.get(key);
    if(!sh||sh.del||sh.js!==js)ch.push({coll:c,id,data:o,js,base:sh&&!sh.del?sh.rev:null,key});}
  for(const [key,sh] of SRV.shadow){const c=key.split('/')[0];if(ARRS.includes(c)&&!sh.del&&!seen.has(key))ch.push({coll:c,id:key.slice(c.length+1),op:'del',base:sh.rev,key,js:sh.js});}
  if(curUser()&&curUser().role==='rt'){
    const meta=[['perms',S.perms],['books',S.books]];if(S.bookLock)meta.push(['bookLock',S.bookLock]);
    for(const [id,v] of meta){const key='meta/'+id,js=JSON.stringify(v),sh=SRV.shadow.get(key);
      if(!sh||sh.del||sh.js!==js)ch.push({coll:'meta',id,data:v,js,base:sh&&!sh.del?sh.rev:null,key});}}
  return ch;}
function srvSchedule(ms){if(!SRV.tok)return;clearTimeout(SRV.timer);SRV.timer=setTimeout(srvFlush,ms===undefined?150:ms);srvStatus();}
async function srvFlush(){
  if(!SRV.tok)return;
  if(SRV.busy){SRV.again=true;return;}
  SRV.busy=true;srvStatus();let guard=0;
  try{
    for(;guard++<60;){
      const all=srvDiff();if(!all.length&&!SRV.audq.length)break;
      const ch=all.slice(0,150),aud=all.length>150?[]:SRV.audq.splice(0);
      let res;
      try{res=await rpc('apply_changes',{changes:ch.map(c=>({coll:c.coll,id:c.id,op:c.op||'set',base:c.base,data:c.data})),audit:aud});}
      catch(e){SRV.audq.unshift(...aud);throw e;}
      const m=new Map(ch.map(c=>[c.key,c]));
      for(const r of res.revs){const c=m.get(r.coll+'/'+r.id);if(c){SRV.shadow.set(c.key,{rev:r.rev,js:c.js,del:!!r.deleted});if(ARRS.includes(c.coll)&&c.data)SRV.idx[c.coll].set(c.id,c.data);}}}
    SRV.net='ok';
    await srvPoll(true);
  }catch(e){
    if(e.net){SRV.net='off';clearTimeout(SRV.timer);SRV.timer=setTimeout(srvFlush,8000);}
    else if(e.status===401){srvLogoutLocal('Sua sessão expirou. Entre de novo.');}
    else{
      const conflict=/CONFLICT/.test(e.message);
      const msg=conflict?'Outra pessoa alterou os mesmos dados ao mesmo tempo. A tela foi atualizada com a versão mais recente. Confira e refaça a última operação.':ptErr(e.message);
      await srvResync();
      openModal('<div class="mh"><h3>Não foi possível salvar</h3><button class="btn ghost sm" data-act="closeModal">Fechar</button></div><div class="err">'+esc(msg)+'</div><p class="muted sm">Nada foi gravado parcialmente: a operação inteira foi desfeita.</p>');}
  }finally{SRV.busy=false;srvStatus();if(SRV.again){SRV.again=false;srvSchedule(0);}}}
async function srvResync(){
  try{const me=await srvLoadAll();if(!me){srvLogoutLocal('Seu acesso foi desativado. Fale com o RT.');return;}fillUsers();render();}catch(e){SRV.net='off';}}

/* ----- Atualização automática ----- */
async function srvPoll(force){
  if(!SRV.tok||(SRV.busy&&!force))return;if(!force&&document.hidden)return;
  try{
    const rows=await srvFetchDocs(SRV.ver),prof=await rest('/profiles?select=*&order=name');
    if(srvDiff().length||SRV.audq.length)return;
    const me=prof.find(p=>p.auth_id===SRV.uid);
    if(!me||!me.active){srvLogoutLocal('Seu acesso foi desativado. Fale com o RT.');return;}
    const old=JSON.stringify(S.perms),uch=applyProfiles(prof);
    if(rows.length)srvApplyDocs(rows);
    SRV.net='ok';
    if(rows.length||uch||old!==JSON.stringify(S.perms)){if(rows.some(r=>r.coll==='meta'&&r.id==='lastBackup')||true)srvRefresh();}
    else srvStatus();
  }catch(e){if(e.net){SRV.net='off';}srvStatus();}}
function srvRefresh(){
  const modal=$('#overlay')&&!$('#overlay').hidden;
  if(modal||FORM_VIEWS.includes(UI.view)){SRV.stale=true;srvStatus();return;}
  SRV.stale=false;fillUsers();render();}
function srvStatusHtml(){
  if(!SERVER)return '';
  const t=SRV.net==='off'?'<span class="t-crit">⚠ Sem conexão: alterações pendentes. Não feche a página.</span>':(SRV.busy||SRV.audq.length)?'<span class="muted">Salvando…</span>':SRV.stale?'<button type="button" class="btn sm" data-act="srvRefresh">Há dados novos · atualizar</button>':'<span class="muted">✓ Sincronizado</span>';
  return '<span id="syncSt" class="sm" style="margin-left:6px">'+t+'</span>';}
function srvStatus(){const e=$('#syncSt');if(e)e.outerHTML=srvStatusHtml();}

/* ----- Entrada, saída e telas de acesso ----- */
function srvLogoutLocal(msg){
  clearTimeout(SRV.timer);clearInterval(SRV.pollT);SRV.pollT=null;srvClearSess();
  closeModal();UI.view='painel';UI.reuse=null;UI.editMode=false;
  ARRS.forEach(c=>{S[c].length=0;SRV.idx[c].clear();});SRV.shadow.clear();SRV.ver=0;S.users=[];S.userId=null;
  srvAuth('login',msg);}
function srvAuth(mode,msg,em){

  else if(mode==='first')h='<h1>Primeiro acesso</h1><p class="muted sm" style="margin:0">Use o e-mail que o RT cadastrou para você e escolha a sua senha. Vamos enviar uma mensagem para confirmar o e-mail.</p><form id="fSbFirst" autocomplete="on">'+fld('sbEmail','E-mail','email','username')+fld('sbPw','Crie uma senha','password','new-password')+fld('sbPw2','Repita a senha','password','new-password')+'<p class="muted sm" style="margin:6px 0 0">Mínimo de 8 caracteres, com letras e números.</p><button class="btn" type="submit" style="margin-top:12px">Criar acesso</button></form>'+box(msg)+'<div class="bar" style="margin-top:14px">'+link('login','Já tenho senha')+'</div>'+wa;
  else if(mode==='forgot')h='<h1>Esqueci a senha</h1><p class="muted sm" style="margin:0">Informe o seu e-mail. Enviaremos um link para criar uma nova senha.</p><form id="fSbForgot">'+fld('sbEmail','E-mail','email','username')+'<button class="btn" type="submit" style="margin-top:12px">Enviar link</button></form>'+box(msg,true)+'<div class="bar" style="margin-top:14px">'+link('login','Voltar')+'</div>'+wa;
  else if(mode==='newpw'||mode==='change')h='<h1>'+(mode==='newpw'?'Crie a nova senha':'Alterar senha')+'</h1><form id="fSb'+(mode==='newpw'?'New':'Change')+'" autocomplete="on">'+fld('sbPw','Nova senha','password','new-password')+fld('sbPw2','Repita a nova senha','password','new-password')+'<p class="muted sm" style="margin:6px 0 0">Mínimo de 8 caracteres, com letras e números.</p><button class="btn" type="submit" style="margin-top:12px">Salvar senha</button></form>'+box(msg)+(mode==='change'?'<div class="bar" style="margin-top:14px"><button type="button" class="btn ghost sm" data-act="cancelPw">Cancelar</button></div>':'');
  else if(mode==='sent')h='<h1>Confira o seu e-mail</h1><div class="okbox">'+esc(msg)+'</div><p class="muted sm">Se não aparecer em alguns minutos, olhe também a caixa de spam.</p><div class="bar">'+link('login','Voltar para entrar')+'</div>';
  else if(mode==='nope')h='<h1>Sem acesso</h1><div class="err">'+esc(msg)+'</div><div class="bar" style="margin-top:12px"><button type="button" class="btn" data-act="logout">Sair</button></div>'+wa;
  else if(mode==='load')h='<h1>Carregando…</h1><p class="muted">Buscando os dados no servidor.</p>';

const sbShow=(m,ok)=>{const b=$('#sbMsg');if(b){b.className=ok?'okbox':'err';b.style.marginTop='12px';b.textContent=m;}};
const redirUrl=()=>encodeURIComponent(location.origin+location.pathname);
async function srvEnter(){
  srvAuth('load');
  let me;
  try{me=await srvLoadAll();}
  catch(e){if(e.net){srvAuth('login','Sem conexão com o servidor. Verifique a internet e tente de novo.');return;}srvAuth('login',ptErr(e.message));return;}
  if(!me){srvAuth('nope','O seu acesso ainda não foi liberado ou está desativado. Fale com o RT.');return;}
  if(!SRV.pollT){SRV.pollT=setInterval(srvPoll,15000);}
  UI.view='painel';enterApp();
  if(me.role==='rt'&&srvDiff().length)srvSchedule(0);}
async function srvBoot(){
  const h=new URLSearchParams((location.hash||'').replace(/^#/,'')),type=h.get('type');
  if(h.get('error_description')){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}srvAuth('login','O link é inválido ou venceu. Peça um novo.');return;}
  if(h.get('access_token')){
    setSess({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:+h.get('expires_in')||3600});
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    if(type==='recovery'){srvAuth('newpw');return;}
    await srvEnter();return;}
  if(sessLoad()){try{await srvFresh(true);}catch(e){if(!e.net){srvAuth('login');return;}}
    await srvEnter();return;}
  srvAuth('login');}

async function srvCredSubmit(kind){
  const em=($('#sbEmail')&&$('#sbEmail').value||'').trim().toLowerCase(),pw=$('#sbPw')?$('#sbPw').value:'',pw2=$('#sbPw2')?$('#sbPw2').value:'';
  const btn=$('form button[type=submit]');if(btn)btn.disabled=true;
  try{
    if(kind==='login'){
      const j=await gt('/token?grant_type=password',{email:em,password:pw});setSess(j);await srvEnter();return;}
    if(kind==='first'){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))throw new Error('E-mail inválido.');
      const er=await pwErrors(pw,null,pw2);if(er.length)throw new Error(er.join(' '));
      const ok=await rpc('signup_allowed',{p_email:em});
      if(!ok)throw new Error('Este e-mail não foi liberado pelo RT ou já tem acesso. Se já tem acesso, use "Esqueci a senha".');
      const j=await gt('/signup?redirect_to='+redirUrl(),{email:em,password:pw});
      if(j&&j.access_token){setSess(j);await srvEnter();return;}
      srvAuth('sent','Enviamos uma mensagem de confirmação para '+em+'. Abra o e-mail e clique no link: você entrará no sistema em seguida.');return;}
    if(kind==='forgot'){
      try{await gt('/recover?redirect_to='+redirUrl(),{email:em});}catch(e){if(e.net)throw e;}
      srvAuth('sent','Se o e-mail '+em+' estiver cadastrado, enviamos um link para criar a nova senha.');return;}
    if(kind==='new'||kind==='change'){
      const er=await pwErrors(pw,null,pw2);if(er.length)throw new Error(er.join(' '));
      await srvFresh();await gt('/user',{password:pw},{method:'PUT',tok:SRV.tok});
      if(kind==='new'){await srvEnter();toast('Senha criada.');}else{log('Alterou a própria senha');save();enterApp();toast('Senha alterada.');}}
  }catch(e){sbShow(ptErr(e.message));if(btn)btn.disabled=false;}}
document.addEventListener('submit',e=>{const f=e.target;if(!SERVER)return;
  const k={fSbLogin:'login',fSbFirst:'first',fSbForgot:'forgot',fSbNew:'new',fSbChange:'change'}[f.id];if(k)srvCredSubmit(k);});

  try{await rpc('admin_save_profile',{p});}catch(e){return bad(ptErr(e.message));}
  await srvPoll(true);await srvLoadAudit();render();
  const msg='Olá, '+p.name+'! Seu acesso ao sistema da SAD Anestesia Móvel foi liberado.\n1) Abra: '+(location.origin+location.pathname)+'\n2) Clique em "Primeiro acesso"\n3) Use este e-mail ('+p.email+') e crie a sua senha.\nVocê receberá uma mensagem para confirmar o e-mail.';
  UI.lastTSV=msg;openModal('<div class="mh"><h3>Acesso liberado</h3><button class="btn ghost sm" data-act="closeModal">Fechar</button></div><div class="okbox">'+esc(p.name)+' · '+esc(p.email)+'</div><p class="sm muted">Envie estas instruções para a pessoa.</p><textarea rows="6" readonly style="width:100%">'+esc(msg)+'</textarea><div class="bar"><button class="btn" data-act="copyBook">Copiar mensagem</button><a class="btn ghost" target="_blank" rel="noopener noreferrer" href="'+esc('https://wa.me/?text='+encodeURIComponent(msg))+'">Abrir no WhatsApp</a></div>');}
function srvEditModal(u){
  openModal('<div class="mh"><h3>Editar usuário</h3><button class="btn ghost sm" data-act="closeModal">Fechar</button></div><form id="fEditU" class="grid"><input type="hidden" id="euId" value="'+esc(u.id)+'"><label>Nome<input id="euName" value="'+esc(u.name)+'" required></label><label>E-mail<input id="euEmail" type="email" value="'+esc(u.email)+'" '+(u.pending?'':'disabled')+'></label><label>Perfil<select id="euRole">'+Object.keys(ROLES).map(r=>'<option value="'+r+'"'+(r===u.role?' selected':'')+'>'+ROLES[r]+'</option>').join('')+'</select></label><label>CRM<input id="euCrm" value="'+esc(u.crm||'')+'"></label><label>Acesso<select id="euAct"><option value="1"'+(u.active!==false?' selected':'')+'>Ativo</option><option value="0"'+(u.active===false?' selected':'')+'>Desativado (não entra mais)</option></select></label><div id="euErr"></div><div class="bar"><button class="btn" type="submit">Salvar</button><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button></div></form>');}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='fEditU')return;const g=id=>$(id).value.trim();
  const p={id:g('#euId'),name:g('#euName'),email:g('#euEmail').toLowerCase(),role:g('#euRole'),crm:g('#euCrm'),active:g('#euAct')==='1'};
  try{await rpc('admin_save_profile',{p});}catch(er){$('#euErr').innerHTML='<div class="err">'+esc(ptErr(er.message))+'</div>';return;}
  closeModal();await srvPoll(true);await srvLoadAudit();render();toast('Usuário salvo.');});

/* ----- Backup ----- */
const lastBk=()=>SERVER?SRV.lastBackup:S.lastBackup;
function bkDays(){const b=lastBk();return b&&b.ts?Math.floor((Date.now()-new Date(b.ts).getTime())/864e5):null;}
function backupBanner(){
  if(!can('backup'))return '';
  const d=bkDays();if(d!==null&&d<=7)return '';
  if(d===null&&!S.items.length)return '';
  return '<div class="err" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span><b>Backup atrasado.</b> '+(d===null?'Ainda não foi feito nenhum backup.':'O último foi há '+d+' dias.')+' Faça a cópia semanal.</span><button class="btn sm" data-act="nav" data-v="backup">Ir para Backup</button></div>';}
function vBackup(){
  const b=lastBk(),d=bkDays();
  const st=b&&b.ts?(d<=7?pill('ok','Em dia'):pill('crit','Atrasado')):pill('warn','Nenhum backup feito');
  const nb=S.books.map(x=>'<button class="btn ghost" data-act="bkBook" data-n="'+x.n+'">PDF do Livro '+x.n+'</button>').join(' ');
  const hist=S.audit.filter(a=>/^Backup baixado/.test(a.action)).slice(0,6).map(a=>'<tr><td class="sm muted" style="white-space:nowrap">'+fmtTs(a.ts)+'</td><td class="sm"><b>'+esc(a.user)+'</b> · '+esc(a.action)+'</td></tr>').join('');
  return '<h2>Backup</h2><p class="sub">Faça a cópia de segurança toda semana. O sistema avisa por e-mail quando passar de 7 dias.</p>'+
   '<section class="card"><h3 style="margin-top:0">Situação</h3><p>'+st+' '+(b&&b.ts?'Último backup: <b>'+fmtTs(b.ts)+'</b>'+(b.by?' por '+esc(b.by):'')+(d>0?' ('+d+' dia'+(d>1?'s':'')+' atrás)':' (hoje)'):'')+'</p>'+
   '<div class="bar"><button class="btn" data-act="bkJson">Baixar backup completo (arquivo .json)</button></div><p class="muted sm">Guarde o arquivo em uma pasta segura da empresa (por exemplo, no Drive da SAD). Ele contém todos os dados do sistema, inclusive os livros.</p></section>'+
   '<section class="card" style="margin-top:14px"><h3 style="margin-top:0">Cópias para consulta e impressão</h3><div class="bar">'+nb+'<button class="btn ghost" data-act="pdfEstAll">PDF do estoque completo</button></div><p class="muted sm">Estas cópias em PDF servem para consulta e para a Vigilância. O backup oficial é o arquivo .json.</p></section>'+
   (SERVER?'<section class="card" style="margin-top:14px"><h3 style="margin-top:0">Integridade dos livros</h3><p class="muted sm" style="margin-top:0">Confere se alguma linha validada dos livros foi alterada depois de selada.</p><div class="bar"><button class="btn ghost" data-act="bkVerify">Conferir integridade</button></div><div id="bkVer"></div></section>':'')+
   (hist?'<section class="card" style="margin-top:14px"><h3 style="margin-top:0">Últimos backups</h3><div class="tw"><table><tbody>'+hist+'</tbody></table></div></section>':'');}
async function bkBuild(){
  let chain=[];if(SERVER){try{chain=await rpc('export_chain');}catch(e){}}
  return JSON.stringify({sistema:'SAD Anestesia Móvel',formato:1,geradoEm:new Date().toISOString(),geradoPor:curUser().name,
    usuarios:S.users.map(u=>({id:u.id,name:u.name,role:u.role,crm:u.crm,email:u.email,active:u.active})),permissoes:S.perms,livros:S.books,inicioDosLivros:S.bookLock||null,
    itens:S.items,movimentos:S.movs,fichas:S.patients,pendencias:S.pend,atividades:S.audit,selosDoLivro:chain},null,1);}
Object.assign(ACT,{
  bkJson:async()=>{
    if(SERVER){await srvFlush();await srvPoll(true);}
    const dl=await getDl();if(!dl){toast('O download não está disponível nesta tela.');return;}
    try{
      const txt=await bkBuild();await dl.save({filename:'backup-sad-anestesia-'+todayISO()+'.json',data:txt});
      const by=curUser().name;
      if(SERVER){try{const r=await rpc('register_backup',{p_kind:'json'});SRV.lastBackup={ts:r.ts,by,kind:'json'};await srvLoadAudit();}catch(e){toast('Backup baixado, mas não foi possível registrar: '+ptErr(e.message));}}
      else{S.lastBackup={ts:new Date().toISOString(),by,kind:'json'};log('Backup baixado: json');save();}
      render();toast('Backup baixado e registrado.');
    }catch(e){if(!e||e.code!=='declined')toast('Não foi possível gerar o backup.');}},
  bkBook:t=>{UI.livro.from='';UI.livro.to='';UI.livro.book=+t.dataset.n;ACT.pdfBookAll(t);},
  bkVerify:async()=>{
    const o=$('#bkVer');if(o)o.innerHTML='<p class="muted">Conferindo…</p>';
    try{const r=await rpc('verify_book_chain');
      if(o)o.innerHTML=r.ok?'<div class="okbox">Tudo certo: '+r.linhas+' linhas seladas conferidas, nenhuma alteração encontrada. ('+fmtTs(r.verificado_em)+')</div>':'<div class="err"><b>Atenção:</b> '+r.problemas.length+' linha(s) com problema. Avise o responsável pelo sistema.<ul>'+r.problemas.map(x=>'<li>Item '+esc(x.item)+', linha '+x.seq+': '+esc(x.problema)+'</li>').join('')+'</ul></div>';
    }catch(e){if(o)o.innerHTML='<div class="err">'+esc(ptErr(e.message))+'</div>';}},
  srvGo:t=>srvAuth(t.dataset.v,'',$('#sbEmail')?$('#sbEmail').value.trim():''),
  srvRefresh:()=>{SRV.stale=false;fillUsers();render();},
  srvEditUser:t=>{const u=S.users.find(x=>x.id===t.dataset.id);if(u)srvEditModal(u);}});
if(SERVER)Object.assign(ACT,{
  logout:async()=>{try{await gt('/logout',null,{tok:SRV.tok});}catch(e){}await srvFlush().catch(()=>{});srvLogoutLocal('');},
  changePw:()=>srvAuth('change'),
  cancelPw:()=>enterApp(),
  resetPw:async t=>{
    if(!can('usuarios'))return;const u=S.users.find(x=>x.id===t.dataset.id);if(!u)return;
    try{await gt('/recover?redirect_to='+redirUrl(),{email:u.email});log('Enviado link de nova senha para '+u.name);save();toast('Link de nova senha enviado para '+u.email+'.');}
    catch(e){toast(ptErr(e.message));}}});
/* ===== Início ===== */
if(SERVER){S=srvSkeleton();}else{S=load();if(!S)seed();}
try{const h=(location.hash||'').slice(1);if(VIEWS[h])UI.view=h;}catch(e){}
if(typeof __TESTENV!=='undefined'){fillUsers();render();}else if(SERVER)srvBoot();else bootAuth();
</script>
